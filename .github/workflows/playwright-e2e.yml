name: Playwright E2E

on:
  pull_request:
    paths:
      - '**/frontend/**'
      - '.github/workflows/**'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Install frontend deps and Playwright browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps
      - name: Start backend (in-memory DB)
        run: |
          cd backend
          export USE_FAKE_DB=1
          export PORT=4001
          npm run dev:sqlite > backend-server.log 2>&1 &
          for i in {1..30}; do
            if curl -sSf http://localhost:4001/api/health; then
              echo "backend ready"; break
            fi
            sleep 1
          done
      - name: Build and start frontend
        run: |
          cd frontend
          npm run build
          npm run start > frontend-server.log 2>&1 &
          for i in {1..30}; do
            if curl -sSf http://localhost:3000; then
              echo "frontend ready"; break
            fi
            sleep 1
          done
      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test --project=chromium --config=playwright.config.ts --reporter=list
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report || echo "no report"
