name: Backend Smoke Tests (cart)

on:
  pull_request:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Init SQLite DB (create schema + seed)
        working-directory: backend
        run: |
          set -e
          if command -v sqlite3 >/dev/null 2>&1; then
            echo "Using sqlite3 CLI to init DB"
            sqlite3 dev.sqlite3 < ../db/sqlite_schema.sql || true
            sqlite3 dev.sqlite3 < ../db/sqlite_seed.sql || true
          else
            echo "sqlite3 CLI not found, falling back to node script"
            node scripts/init_sqlite.js
          fi

      - name: Build and start backend container, then wait for health
        run: |
          set -e
          echo "Building backend Docker image (shows npm install/build errors)"
          docker build -t backend-ci -f backend/Dockerfile backend || { echo "docker build failed"; exit 1; }

          echo "Starting backend container from image"
          docker run -d --name backend-test -p 4000:4000 -e USE_FAKE_DB=1 backend-ci || { echo "docker run failed"; docker ps -a || true; exit 1; }

          echo "Streaming initial container logs (background)"
          docker logs -f backend-test 2>&1 | sed -u 's/^/[container] /' &

          echo "Waiting for API health..."
          for i in {1..60}; do
            if curl -sSf http://localhost:4000/api/health >/dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            echo "health check attempt $i failed; printing last container logs:"
            docker logs --tail 50 backend-test || true
            sleep 1
          done

          if ! curl -sSf http://localhost:4000/api/health >/dev/null 2>&1; then
            echo "Server failed to start. Full container logs:" 
            docker logs backend-test || true
            docker ps -a || true
            docker inspect backend-test || true
            exit 1
          fi

      - name: Run cart smoke test
        working-directory: backend
        run: npm run smoke:cart

      - name: Stop backend
        if: always()
        run: |
          echo "Cleaning up container"
          docker stop backend-test || true
          docker rm backend-test || true
          docker image rm backend-ci || true
          sleep 1
