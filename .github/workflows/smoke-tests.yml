name: Backend Smoke Tests (cart)

on:
  pull_request:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Start backend (SQLite) and wait for health
        working-directory: backend
        run: |
          set -e
          npm run dev:sqlite &> server.log &
          echo $! > server.pid

          echo "Waiting for API health..."
          for i in {1..30}; do
            if curl -sSf http://localhost:4000/api/health >/dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 1
          done

          if ! curl -sSf http://localhost:4000/api/health >/dev/null 2>&1; then
            echo "Server failed to start. Dumping server.log:"
            cat server.log || true
            exit 1
          fi

      - name: Run cart smoke test
        working-directory: backend
        run: npm run smoke:cart

      - name: Stop backend
        if: always()
        working-directory: backend
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi
          sleep 1
